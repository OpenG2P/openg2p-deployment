questions:
  - variable: api.env.API_ROOT_URL
    group: "API Configuration"
    label: "API Root URL"
    description: "Base URL for the Novu API service"
    type: string
    required: true
    default: "https://novu-api.loadtest.openg2p.org"

  - variable: api.env.FRONT_BASE_URL
    group: "API Configuration"
    label: "Dashboard Base URL"
    description: "Public URL for the Novu dashboard (3.x)"
    type: string
    required: true
    default: "https://novu.loadtest.openg2p.org"

  - variable: dashboard.apiExternalEndpoint
    group: "Dashboard Configuration"
    label: "API External Endpoint"
    description: "Public API endpoint used by the dashboard"
    type: string
    required: true
    default: "https://novu-api.loadtest.openg2p.org"

  - variable: dashboard.wsExternalEndpoint
    group: "Dashboard Configuration"
    label: "WebSocket External Endpoint"
    description: "Public WebSocket endpoint used by the dashboard"
    type: string
    required: true
    default: "https://novu-ws.loadtest.openg2p.org"

  - variable: bootstrap.email
    group: "Bootstrap"
    label: "Admin email"
    description: "First dashboard user, stored on the Novu secret. The commons API-key Job signs this user up."
    type: string
    default: "admin@openg2p.org"
