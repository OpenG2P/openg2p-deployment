name: novu
description: A Helm Chart for Novu (self-hosted notifications)
version: 3.19.0
apiVersion: v2
appVersion: 3.19.0
keywords:
  - novu
  - notification framework
sources:
  - https://github.com/novuhq/novu/tree/next/docker/kubernetes/helm
home: https://novu.co/
dependencies:
  - condition: redis.enabled
    name: redis
    repository: https://openg2p.github.io/openg2p-helm
    version: 19.6.4
  - condition: mongodb.enabled
    alias: mongodb
    name: mongodb
    version: 13.18.5
  - name: common
    repository: https://openg2p.github.io/openg2p-helm
    version: 2.30.0
  - condition: localstack.enabled
    name: localstack
    version: 0.4.3
icon: https://openg2p.github.io/openg2p-helm/openg2p-logo.png
annotations:
  catalog.cattle.io/display-name: "novu"
