{{- if and .Values.mongodb.enabled .Values.mongodb.auth.manageSecret (not .Values.externalDatabase.existingSecret) }}
{{- $secretName := include "novu.mongodb.authSecretName" . }}
{{- $password := include "novu.mongodb.password" . | trim }}
{{- $root := include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "mongodb-root-password" "providedValues" (list "mongodb.auth.rootPassword") "length" 16 "strong" false "context" $) | trimAll "\"" | b64dec }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  mongodb-root-password: {{ $root | b64enc | quote }}
  mongodb-passwords: {{ $password | b64enc | quote }}
  mongoUrl: {{ printf "mongodb://%s:%s@%s:%s/%s" (include "novu.mongodb.username" .) $password (include "novu.mongodb.host" .) (include "novu.mongodb.port" .) (include "novu.mongodb.database" .) | b64enc | quote }}
{{- else if and (not .Values.externalDatabase.existingSecret) (not .Values.mongodb.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "novu.mongodb.secretName" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  mongoUrl: {{ printf "mongodb://%s:%s@%s:%s/%s" (include "novu.mongodb.username" .) (include "novu.mongodb.password" .) (include "novu.mongodb.host" .) (include "novu.mongodb.port" .) (include "novu.mongodb.database" .) | b64enc | quote }}
{{- end }}
