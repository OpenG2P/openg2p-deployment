{{- if (not .Values.existingSecret) -}}
{{- $secretName := include "common.names.fullname" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" (dict "value" .Values.commonLabels "context" $) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" (dict "value" .Values.commonAnnotations "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
data:
  jwt-secret: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "jwt-secret" "providedValues" (list "jwt.secret") "length" 32 "strong" false "context" $) }}
  store-encryption-key: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "store-encryption-key" "providedValues" (list "store.encryption-key") "length" 32 "strong" false "context" $) }}
  novu-secret-key: {{ include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "novu-secret-key" "providedValues" (list "api.env.NOVU_SECRET_KEY") "length" 32 "strong" false "context" $) }}
  admin-email: {{ .Values.bootstrap.email | b64enc | quote }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- $existingData := dict }}
  {{- if $existing }}
  {{- $existingData = $existing.data | default dict }}
  {{- end }}
  {{- $adminPassword := "" }}
  {{- if index $existingData "admin-password" }}
  {{- $adminPassword = index $existingData "admin-password" | b64dec }}
  {{- else }}
  {{- $generated := include "common.secrets.passwords.manage" (dict "secret" $secretName "key" "admin-password" "providedValues" (list "bootstrap.password") "length" 16 "strong" false "skipQuote" true "context" $) | trim | b64dec }}
  {{- if .Values.bootstrap.password }}
  {{- $adminPassword = $generated }}
  {{- else }}
  {{- $adminPassword = printf "%sAa1!" $generated }}
  {{- end }}
  {{- end }}
  admin-password: {{ $adminPassword | b64enc | quote }}
  {{- $apiKey := .Values.notificationApiKey }}
  {{- if and (not $apiKey) (index $existingData "api-key") }}
  {{- $apiKey = index $existingData "api-key" | b64dec }}
  {{- end }}
  {{- if $apiKey }}
  api-key: {{ $apiKey | b64enc | quote }}
  {{- end }}
{{- end }}
