# =============================================================================
# OpenG2P Add-Node Configuration
# =============================================================================
# Copy this file to add-node-config.yaml and fill in your values:
#   cp add-node-config.example.yaml add-node-config.yaml
#
# Run from your ADMIN LAPTOP (no need to SSH into the node):
#   ./openg2p-add-node.sh --config add-node-config.yaml
#
# After AWS provisioning, ssh_* / node_ip / node_name are often filled from
# aws/provision-output.yaml automatically when that file exists.
# =============================================================================

# ---------------------------------------------------------------------------
# SSH — how this laptop reaches the NEW node
# ---------------------------------------------------------------------------
# Required for the laptop orchestrator.
ssh_host: ""          # public IP or reachable hostname of the NEW node
ssh_user: "ubuntu"
ssh_key:  ""          # local path to .pem  (e.g. ~/sshkeys/openg2p-aws3.pem)

# ---------------------------------------------------------------------------
# SSH — control-plane (primary) — used by openg2p-remove-node.sh / verify
# ---------------------------------------------------------------------------
# Private IP works if you jump via VPN/Wireguard; otherwise use the RP public
# IP only if kubectl on primary is reachable that way (usually private + VPN).
primary_ssh_host: ""
primary_ssh_user: "ubuntu"
primary_ssh_key:  ""          # defaults to ssh_key when blank

# ---------------------------------------------------------------------------
# Existing cluster — where this node will join
# ---------------------------------------------------------------------------
# URL of the RKE2 supervisor on ANY existing control-plane (server) node.
# Format: https://<server-ip-or-host>:9345
#
# Use the PRIVATE IP when the new node is on the same VPC (normal case).
# Port is always 9345 (RKE2 supervisor), NOT 6443.
server_url: ""

# Cluster-wide RKE2 join token (from a control-plane node):
#   sudo cat /var/lib/rancher/rke2/server/node-token
rke2_token: ""

# RKE2 version — MUST match the existing cluster (rke2 --version).
rke2_version: "v1.35.8+rke2r1"

# ---------------------------------------------------------------------------
# This new node
# ---------------------------------------------------------------------------
# Private IP of this node (used by RKE2, firewall rules, kubelet).
node_ip: ""

# Unique name for this node in the cluster (kubectl get nodes).
node_name: "node2"

# Role: "server" (control-plane) or "worker" (agent). Leave empty to prompt.
node_role: ""

# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
# VPC / private network CIDR for inter-node firewall rules.
vpc_subnet: ""

# Wireguard peer subnet — MUST match the RP wireguard.subnet (default below).
wireguard_subnet: "10.15.0.0/16"
