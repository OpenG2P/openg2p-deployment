# =============================================================================
# OpenG2P Environment Configuration
# =============================================================================
# Copy this file to environment-config.yaml and fill in your values:
#   cp environment-config.example.yaml environment-config.yaml
#
# Preferred — from your laptop (SSHes into the VM):
#   ./roles/environment/run.sh --config environment-config.yaml
#
# Or via the full orchestrator:
#   ./openg2p-sandbox.sh --config sandbox-config.yaml --stage environment
#
# Advanced — on the VM after infra is installed:
#   sudo ./roles/environment/run.sh --config environment-config.yaml
#
# Prerequisites:
#   Base infrastructure must be set up first (roles/infra/run.sh / orchestrator)
# =============================================================================

# ---------------------------------------------------------------------------
# Environment
# ---------------------------------------------------------------------------
# Environment name (used as K8s namespace and Rancher project name).
# Keep it short, lowercase, no hyphens (e.g., dev, qa, staging, pilot).
# You can run this script multiple times with different environments
# to create multiple isolated setups on the same cluster.
environment: "dev"

# Base domain for this environment.
# Modules will be accessible at: <module>.<base_domain>
#
# Leave empty to auto-derive as <environment>.<domain>, where `domain` comes
# from sandbox-config.yaml — e.g. with domain "mydept.dedyn.io" this yields
# dev.mydept.dedyn.io → minio.dev.mydept.dedyn.io, superset.dev.mydept.dedyn.io
#
# A wildcard A record (*.<base_domain>) and a Let's Encrypt wildcard
# certificate for *.<base_domain> are created automatically.
#
# If you set this explicitly to a domain OUTSIDE `domain`, the DNS records are
# not managed for you — create them yourself before running.
base_domain: ""

# ---------------------------------------------------------------------------
# Infrastructure reference
# ---------------------------------------------------------------------------
# Path to the sandbox config file (inherits node_ip, domain, tls.*, etc.)
# Relative paths are resolved from the automation/sandbox/ directory.
sandbox_config: "sandbox-config.yaml"

# ---------------------------------------------------------------------------
# openg2p-commons-base (infrastructure: PostgreSQL, Kafka, MinIO, etc.)
# ---------------------------------------------------------------------------
# Installed first. Provides databases, message queues, and keycloak-init.
commons_base:
  # Chart name in the Helm repo (or local directory name)
  chart_name: "openg2p-commons-base"
  # Path to local chart directory. Leave empty for remote Helm chart.
  chart_path: ""
  chart_repo: "https://gitlab.com/api/v4/projects/84460547/packages/helm/stable"
  chart_version: "0.0.0-develop"
  # Extra Helm arguments (e.g., "--set postgresql.primary.persistence.size=20Gi")
  extra_helm_args: ""

# ---------------------------------------------------------------------------
# openg2p-commons-services (apps: eSignet, KeyManager, Superset, ODK, etc.)
# ---------------------------------------------------------------------------
# Installed second. Depends on commons-base for PostgreSQL, Redis, etc.
commons_services:
  # Chart name in the Helm repo (or local directory name)
  chart_name: "openg2p-commons-services"
  # Path to local chart directory. Leave empty for remote Helm chart.
  chart_path: ""
  chart_repo: "https://gitlab.com/api/v4/projects/84460547/packages/helm/stable"
  chart_version: "0.0.0-develop"
  # Extra Helm arguments
  extra_helm_args: ""

# ---------------------------------------------------------------------------
# Modules — set to true/false to enable/disable
# ---------------------------------------------------------------------------
# commons installs both charts above (base + services).
# Must be true if any future module below is true.
modules:
  commons: true
  # Future modules (not yet implemented in automation):
  # registry: false
  # pbms: false
  # spar: false
  # g2p_bridge: false
